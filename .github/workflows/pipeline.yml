# Pipeline del backend (issues #23-#28)
#
#   PR a develop/main  ──► ci
#   push a develop     ──► ci ─► build (:dev, :sha-<commit>) ─► deploy-dev ─► uat
#   push a main        ──► ci ─► build (:latest, :sha-<commit>) ─► deploy-prod (espera aprobación)
#
# Secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Environments: dev, production (production con Required reviewers = aprobación manual).

name: Pipeline backend

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGEN: mathnap2/cuentas-claras
  # Nombres de las Web Apps: `terraform output webapp_names` en el repo de infraestructura.
  WEBAPP_DEV: app-cc-api-dev-4yzr
  WEBAPP_PROD: app-cc-api-prod-4yzr
  PYTHON_VERSION: "3.12"

jobs:
  ci:
    name: Lint, pruebas y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8

      - name: Pruebas unitarias con cobertura (mínimo 80 %)
        run: >
          pytest
          --junitxml=test-results/unit.xml
          --cov-report=xml:test-results/coverage.xml
          --cov-report=html:test-results/htmlcov
          --cov-fail-under=80

      - name: Reporte en el resumen del job
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path

          unit = Path("test-results/unit.xml")
          if unit.exists():
              s = ET.parse(unit).getroot()
              s = s if s.tag == "testsuite" else s.find("testsuite")
              total, fallas = int(s.get("tests")), int(s.get("failures")) + int(s.get("errors"))
              print(f"### Pruebas unitarias\n\n{total - fallas} de {total} pasaron ({fallas} fallas)\n")
          cov = Path("test-results/coverage.xml")
          if cov.exists():
              pct = float(ET.parse(cov).getroot().get("line-rate")) * 100
              print(f"### Cobertura\n\n**{pct:.1f} %** de líneas (mínimo 80 %)\n")
          EOF
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-unitarias
          path: test-results/

  imagen:
    name: Construir y probar la imagen
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t cc-api:ci .

      - name: Prueba de humo del contenedor
        run: |
          # SQLite dentro del contenedor: solo se prueba que la imagen arranca y responde.
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=sqlite:////tmp/ci.db -e SECRET_KEY=ci cc-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'
          test "$(docker exec api id -u)" != "0" || { echo "El contenedor corre como root"; exit 1; }
          echo "Imagen OK"

      - name: Logs del contenedor
        if: always()
        run: docker logs api || true

  build:
    name: Build y push a Docker Hub
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      imagen: ${{ steps.tags.outputs.imagen }}
    steps:
      - uses: actions/checkout@v4

      - name: Calcular etiquetas
        id: tags
        run: |
          # develop → :dev   main → :latest   siempre → :sha-<commit> (la que se despliega)
          if [ "$GITHUB_REF_NAME" = "main" ]; then canal=latest; else canal=dev; fi
          echo "imagen=$IMAGEN:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "lista<<FIN"
            echo "$IMAGEN:sha-$GITHUB_SHA"
            echo "$IMAGEN:$canal"
            echo "FIN"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.lista }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          echo "### Imagen publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.tags.outputs.lista }}" | sed 's/^/- `/; s/$/`/' >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    name: Deploy a dev
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://${{ env.WEBAPP_DEV }}.azurewebsites.net
    permissions:
      id-token: write   # OIDC con Azure (ver identity.tf en el repo de infraestructura)
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_DEV }}
          images: docker.io/${{ needs.build.outputs.imagen }}

  uat:
    name: Pruebas UAT contra dev
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Esperar a que dev arranque la nueva imagen
        # Azure tarda en descargar la imagen y reiniciar el contenedor; mientras tanto sigue
        # respondiendo el contenedor anterior.
        run: sleep 60

      - name: Pruebas UAT
        env:
          UAT_BASE_URL: https://${{ env.WEBAPP_DEV }}.azurewebsites.net
        run: pytest uat -o addopts="" -v --junitxml=test-results/uat.xml

      - name: Reporte en el resumen del job
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path

          archivo = Path("test-results/uat.xml")
          if not archivo.exists():
              print("### Pruebas UAT\n\nNo se generó reporte")
              raise SystemExit
          s = ET.parse(archivo).getroot()
          s = s if s.tag == "testsuite" else s.find("testsuite")
          print("### Pruebas UAT contra dev\n\n| Escenario | Resultado |\n|---|---|")
          for caso in s.iter("testcase"):
              ok = caso.find("failure") is None and caso.find("error") is None
              print(f"| {caso.get('name')} | {'✅' if ok else '❌'} |")
          EOF

      - name: Publicar reporte UAT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-uat
          path: test-results/

  deploy-prod:
    name: Deploy a producción
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # El environment production tiene Required reviewers: el job espera la aprobación manual.
    environment:
      name: production
      url: https://${{ env.WEBAPP_PROD }}.azurewebsites.net
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_PROD }}
          images: docker.io/${{ needs.build.outputs.imagen }}

      - name: Verificar /health en producción
        run: |
          url="https://$WEBAPP_PROD.azurewebsites.net/health"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 30 "$url"; then echo; echo "Producción responde"; exit 0; fi
            echo "Intento $i: todavía no responde, reintento en 10 s"; sleep 10
          done
          echo "Producción no respondió en 5 minutos"; exit 1
